<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catch the Dot 🎯</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      margin: 15px 0 5px;
      font-size: 30px;
    }

    #score, #timer, #highScore, #level {
      font-size: 19px;
      margin: 5px;
    }

    #game {
      position: relative;
      width: 95vw;
      height: 70vh;
      margin: 15px auto;
      border: 2px solid white;
      border-radius: 12px;
      background: #222;
      overflow: hidden;
    }

    #dot {
      position: absolute;
      width: 55px;
      height: 55px;
      background: red;
      border-radius: 50%;
      display: none;
      cursor: pointer;
      box-shadow: 0 0 15px red;
      transition: width 0.15s, height 0.15s, transform 0.08s;
    }

    #dot.hit {
      transform: scale(1.5);
    }

    #start {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      margin-top: 5px;
    }
  </style>
</head>

<body>

  <h1>🎯 Catch the Dot</h1>

  <div id="score">Score: 0</div>
  <div id="timer">Time: 30</div>
  <div id="highScore">🏆 High Score: 0</div>
  <div id="level">🟢 Easy</div>

  <button id="start">START GAME</button>

  <div id="game">
    <div id="dot"></div>
  </div>

  <script>
    let score = 0;
    let time = 30;
    let gameRunning = false;
    let timer;
    let moveTimer;

    let highScore = localStorage.getItem("highScore") || 0;

    const dot = document.getElementById("dot");
    const game = document.getElementById("game");
    const scoreText = document.getElementById("score");
    const timerText = document.getElementById("timer");
    const highScoreText = document.getElementById("highScore");
    const levelText = document.getElementById("level");
    const startButton = document.getElementById("start");

    highScoreText.textContent = "🏆 High Score: " + highScore;

    function setDifficulty() {

      let size;
      let speed;

      if (score < 10) {
        size = 55;
        speed = 1000;
        levelText.textContent = "🟢 Easy";
      }

      else if (score < 20) {
        size = 45;
        speed = 750;
        levelText.textContent = "🟡 Medium";
      }

      else if (score < 30) {
        size = 35;
        speed = 550;
        levelText.textContent = "🟠 Hard";
      }

      else {
        size = 28;
        speed = 400;
        levelText.textContent = "🔴 INSANE";
      }

      dot.style.width = size + "px";
      dot.style.height = size + "px";

      clearInterval(moveTimer);

      moveTimer = setInterval(function() {

        if (gameRunning) {
          moveDot();
        }

      }, speed);
    }

    function moveDot() {

      const maxX = game.clientWidth - dot.offsetWidth;
      const maxY = game.clientHeight - dot.offsetHeight;

      dot.style.left = Math.random() * maxX + "px";
      dot.style.top = Math.random() * maxY + "px";
    }

    dot.onclick = function() {

      if (!gameRunning) return;

      score++;

      scoreText.textContent = "Score: " + score;

      dot.classList.add("hit");

      setTimeout(function() {
        dot.classList.remove("hit");
      }, 80);

      setDifficulty();
      moveDot();
    };

    startButton.onclick = function() {

      clearInterval(timer);
      clearInterval(moveTimer);

      score = 0;
      time = 30;
      gameRunning = true;

      scoreText.textContent = "Score: 0";
      timerText.textContent = "Time: 30";
      levelText.textContent = "🟢 Easy";

      startButton.style.display = "none";
      dot.style.display = "block";

      setDifficulty();
      moveDot();

      timer = setInterval(function() {

        time--;

        timerText.textContent = "Time: " + time;

        if (time <= 0) {

          clearInterval(timer);
          clearInterval(moveTimer);

          gameRunning = false;

          dot.style.display = "none";
          startButton.style.display = "inline-block";
          startButton.textContent = "PLAY AGAIN";

          if (score > highScore) {

            highScore = score;

            localStorage.setItem("highScore", highScore);

            highScoreText.textContent =
              "🏆 High Score: " + highScore;

            alert("🎉 NEW HIGH SCORE! 🎉\n\nScore: " + score);

          } else {

            alert(
              "GAME OVER! 🎯\n\nScore: " + score +
              "\nHigh Score: " + highScore
            );
          }
        }

      }, 1000);
    };
  </script>

</body>
</html>
