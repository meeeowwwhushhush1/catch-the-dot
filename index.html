<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catch the Dot 🎯</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 140, 255, 0.18), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(130, 0, 255, 0.18), transparent 30%),
        #030712;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.25;
      pointer-events: none;
    }

    body::before {
      background: #008cff;
      top: -180px;
      left: -180px;
      animation: blueGlow 7s ease-in-out infinite alternate;
    }

    body::after {
      background: #8a2be2;
      right: -180px;
      bottom: -180px;
      animation: purpleGlow 8s ease-in-out infinite alternate;
    }

    @keyframes blueGlow {
      from {
        transform: translate(0, 0);
      }

      to {
        transform: translate(120px, 80px);
      }
    }

    @keyframes purpleGlow {
      from {
        transform: translate(0, 0);
      }

      to {
        transform: translate(-100px, -80px);
      }
    }

    .bgParticle {
      position: fixed;
      width: 3px;
      height: 3px;
      background: #55c7ff;
      border-radius: 50%;
      opacity: 0.6;
      pointer-events: none;
      animation: floatParticle linear infinite;
    }

    @keyframes floatParticle {
      from {
        transform: translateY(110vh);
        opacity: 0;
      }

      20% {
        opacity: 0.7;
      }

      80% {
        opacity: 0.7;
      }

      to {
        transform: translateY(-10vh);
        opacity: 0;
      }
    }

    h1 {
      margin: 15px 0 5px;
      font-size: 30px;
      text-shadow:
        0 0 8px #00aaff,
        0 0 20px #0066ff;
    }

    #score,
    #timer,
    #highScore,
    #level {
      font-size: 19px;
      margin: 5px;
      text-shadow: 0 0 8px rgba(0, 180, 255, 0.7);
    }

    #game {
      position: relative;
      width: 95vw;
      height: 70vh;
      margin: 15px auto;

      border: 2px solid #00aaff;
      border-radius: 15px;

      background:
        radial-gradient(
          circle at center,
          rgba(0, 100, 255, 0.10),
          rgba(0, 0, 20, 0.65)
        );

      overflow: hidden;

      box-shadow:
        0 0 10px #008cff,
        0 0 30px rgba(0, 140, 255, 0.35),
        inset 0 0 30px rgba(0, 100, 255, 0.12);
    }

    #game::before {
      content: "";
      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(0, 160, 255, 0.06) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(0, 160, 255, 0.06) 1px,
          transparent 1px
        );

      background-size: 35px 35px;

      animation: gridMove 5s linear infinite;
      pointer-events: none;
    }

    @keyframes gridMove {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 35px 35px;
      }
    }

    #dot {
      position: absolute;
      width: 55px;
      height: 55px;

      background:
        radial-gradient(
          circle at 35% 30%,
          #ff7777,
          #ff0000 45%,
          #990000
        );

      border-radius: 50%;
      display: none;
      cursor: pointer;

      box-shadow:
        0 0 10px red,
        0 0 25px red,
        0 0 45px rgba(255, 0, 0, 0.8);

      transition:
        width 0.15s,
        height 0.15s;

      z-index: 5;
    }

    #dot.hit {
      animation: hit 0.18s ease;
    }

    @keyframes hit {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.5);
      }

      100% {
        transform: scale(1);
      }
    }

    .particle {
      position: absolute;
      width: 8px;
      height: 8px;

      background: #00c8ff;
      border-radius: 50%;

      pointer-events: none;

      box-shadow:
        0 0 8px #00c8ff,
        0 0 15px #008cff;

      animation: explode 0.4s forwards;

      z-index: 6;
    }

    @keyframes explode {
      from {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }

      to {
        transform:
          translate(var(--x), var(--y))
          scale(0);

        opacity: 0;
      }
    }

    #start {
      padding: 13px 28px;
      font-size: 18px;
      font-weight: bold;

      color: white;

      background:
        linear-gradient(
          135deg,
          #007bff,
          #6a00ff
        );

      border: 1px solid #4dc9ff;
      border-radius: 10px;

      margin-top: 5px;
      cursor: pointer;

      box-shadow:
        0 0 10px rgba(0, 140, 255, 0.7),
        0 0 25px rgba(80, 0, 255, 0.4);

      transition: 0.2s;
    }

    #start:hover {
      transform: scale(1.05);

      box-shadow:
        0 0 15px #00aaff,
        0 0 35px #6600ff;
    }

    #start:active {
      transform: scale(0.96);
    }

    #musicButton {
      padding: 8px 14px;
      margin-top: 8px;
      font-size: 14px;
      font-weight: bold;
      color: white;
      background: rgba(0, 100, 255, 0.25);
      border: 1px solid #00aaff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 170, 255, 0.4);
    }
  </style>
</head>

<body>

  <div class="bgParticle" style="left:5%; animation-duration:9s;"></div>
  <div class="bgParticle" style="left:15%; animation-duration:12s;"></div>
  <div class="bgParticle" style="left:27%; animation-duration:10s;"></div>
  <div class="bgParticle" style="left:40%; animation-duration:14s;"></div>
  <div class="bgParticle" style="left:52%; animation-duration:11s;"></div>
  <div class="bgParticle" style="left:64%; animation-duration:13s;"></div>
  <div class="bgParticle" style="left:76%; animation-duration:9s;"></div>
  <div class="bgParticle" style="left:88%; animation-duration:15s;"></div>

  <h1>🎯 Catch the Dot</h1>

  <div id="score">Score: 0</div>
  <div id="timer">Time: 30</div>
  <div id="highScore">🏆 High Score: 0</div>
  <div id="level">🟢 Easy</div>

  <button id="start">START GAME</button>
  <br>

  <button id="musicButton">🎵 MUSIC ON</button>

  <div id="game">
    <div id="dot"></div>
  </div>

  <audio id="bgMusic" loop preload="auto">
    <source src="neon_arcade_background.mp3" type="audio/mpeg">
  </audio>

  <script>

    let score = 0;
    let time = 30;
    let gameRunning = false;

    let timer;
    let moveTimer;
    let audioContext = null;

    const bgMusic =
      document.getElementById("bgMusic");

    const musicButton =
      document.getElementById("musicButton");

    bgMusic.volume = 0.35;

    let musicOn = true;

    let highScore =
      localStorage.getItem("highScore") || 0;

    const dot =
      document.getElementById("dot");

    const game =
      document.getElementById("game");

    const scoreText =
      document.getElementById("score");

    const timerText =
      document.getElementById("timer");

    const highScoreText =
      document.getElementById("highScore");

    const levelText =
      document.getElementById("level");

    const startButton =
      document.getElementById("start");


    highScoreText.textContent =
      "🏆 High Score: " + highScore;


    // MUSIC BUTTON

    musicButton.onclick = function() {

      if (musicOn) {

        bgMusic.pause();

        musicOn = false;

        musicButton.textContent =
          "🔇 MUSIC OFF";

      } else {

        bgMusic.play();

        musicOn = true;

        musicButton.textContent =
          "🎵 MUSIC ON";
      }
    };


    // SOUND

    function playSound() {

      if (!audioContext) {

        audioContext =
          new (window.AudioContext ||
               window.webkitAudioContext)();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      const oscillator =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();

      oscillator.type = "sine";

      oscillator.frequency.setValueAtTime(
        700,
        audioContext.currentTime
      );

      oscillator.frequency.exponentialRampToValueAtTime(
        300,
        audioContext.currentTime + 0.1
      );

      gain.gain.setValueAtTime(
        0.25,
        audioContext.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.1
      );

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start();

      oscillator.stop(
        audioContext.currentTime + 0.1
      );
    }


    // MOVE DOT

    function moveDot() {

      const maxX =
        game.clientWidth -
        dot.offsetWidth;

      const maxY =
        game.clientHeight -
        dot.offsetHeight;

      dot.style.left =
        Math.random() * maxX + "px";

      dot.style.top =
        Math.random() * maxY + "px";
    }


    // DIFFICULTY

    function setDifficulty() {

      let size;
      let speed;

      if (score < 10) {

        size = 55;
        speed = 1000;

        levelText.textContent =
          "🟢 Easy";

      } else if (score < 20) {

        size = 45;
        speed = 750;

        levelText.textContent =
          "🟡 Medium";

      } else if (score < 30) {

        size = 35;
        speed = 550;

        levelText.textContent =
          "🟠 Hard";

      } else {

        size = 28;
        speed = 400;

        levelText.textContent =
          "🔴 INSANE";
      }

      dot.style.width =
        size + "px";

      dot.style.height =
        size + "px";

      clearInterval(moveTimer);

      moveTimer =
        setInterval(function() {

          if (gameRunning) {
            moveDot();
          }

        }, speed);
    }


    // PARTICLES

    function createParticles() {

      const rect =
        dot.getBoundingClientRect();

      const gameRect =
        game.getBoundingClientRect();

      const centerX =
        rect.left -
        gameRect.left +
        rect.width / 2;

      const centerY =
        rect.top -
        gameRect.top +
        rect.height / 2;

      for (let i = 0; i < 10; i++) {

        const particle =
          document.createElement("div");

        particle.className =
          "particle";

        particle.style.left =
          centerX + "px";

        particle.style.top =
          centerY + "px";

        particle.style.setProperty(
          "--x",
          (Math.random() * 100 - 50) + "px"
        );

        particle.style.setProperty(
          "--y",
          (Math.random() * 100 - 50) + "px"
        );

        game.appendChild(particle);

        setTimeout(function() {
          particle.remove();
        }, 400);
      }
    }


    // DOT TAP

    dot.onclick = function() {

      if (!gameRunning) return;

      score++;

      scoreText.textContent =
        "Score: " + score;

      playSound();

      createParticles();

      dot.classList.remove("hit");

      void dot.offsetWidth;

      dot.classList.add("hit");

      setDifficulty();

      moveDot();
    };


    // START GAME

    startButton.onclick = function() {

      clearInterval(timer);
      clearInterval(moveTimer);

      score = 0;
      time = 30;
      gameRunning = true;

      scoreText.textContent =
        "Score: 0";

      timerText.textContent =
        "Time: 30";

      levelText.textContent =
        "🟢 Easy";

      startButton.style.display =
        "none";

      dot.style.display =
        "block";


      // START MUSIC

      if (musicOn) {

        bgMusic.currentTime = 0;

        bgMusic.play().catch(function(error) {
          console.log("Music could not start:", error);
        });
      }


      // AUDIO

      if (!audioContext) {

        audioContext =
          new (window.AudioContext ||
               window.webkitAudioContext)();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      setDifficulty();

      moveDot();


      timer =
        setInterval(function() {

          time--;

          timerText.textContent =
            "Time: " + time;

          if (time <= 0) {

            clearInterval(timer);
            clearInterval(moveTimer);

            gameRunning = false;

            dot.style.display =
              "none";

            startButton.style.display =
              "inline-block";

            startButton.textContent =
              "PLAY AGAIN";

            bgMusic.pause();


            if (score > highScore) {

              highScore = score;

              localStorage.setItem(
                "highScore",
                highScore
              );

              highScoreText.textContent =
                "🏆 High Score: " +
                highScore;

              alert(
                "🎉 NEW HIGH SCORE! 🎉\n\nScore: " +
                score
              );

            } else {

              alert(
                "GAME OVER! 🎯\n\nScore: " +
                score +
                "\nHigh Score: " +
                highScore
              );
            }
          }

        }, 1000);
    };

  </script>

</body>
</html>
